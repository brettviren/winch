# winch -c layers.toml -c recipes.toml <recipe>

[recipe.debian_dev]
stack = ["network_local", "host_big", "debian", "debian_dev"]

[recipe.alma_dev]
stack = ["network_local", "host_big", "alma", "alma_dev"]

[recipe.spack_build]
stack = ["spack", "spack_compiler"]

[recipe.debian_spack_gcc]
recipe_base = ["debian_dev", "spack_build"]


[recipe.spack_phlex]
recipe_base = "spack_build"
stack = ["spack_phlex_repos", "spack_phlex"]

[recipe.spack_wctenv]
recipe_base = "spack_build"
stack = ["spack_wirecell_repos", "spack_wctenv"]

[recipe.debian_spack_wctenv]
recipe_base = ["debian_dev", "spack_wctenv"]


[recipe.debian_spack_phlex]
recipe_base = ["debian_dev", "spack_phlex"]

[recipe.alma_spack_phlex]
recipe_base = ["alma_dev", "spack_phlex"]

[recipe.debian_spack_wirecell]
recipe_base = ["debian_dev", "spack_wctenv"]

[recipe.alma_spack_wirecell]
recipe_base = ["alma_dev", "spack_wctenv"]



[recipe.spack_wcph]
recipe_base = "spack_build"
stack = ["spack_phlex_repos", "spack_wirecell_repos", "spack_wcph_env"]

[recipe.debian_spack_wcph]
recipe_base = ["debian_dev", "spack_wcph"]

[recipe.debian_spack_wcph_devel]
description = "Wire-Cell/Phlex spack environment with devel user"
recipe_base = ["debian_spack_wcph"]
stack = ["devel"]




[recipe.spack_edepsimphony]
recipe_base = "spack_build"
stack = ["spack_edepsimphony"]

[recipe.debian_spack_edepsimphony]
recipe_base = ["debian_dev", "spack_edepsimphony"]


